<jb-admin-shell
  [groups]="groups()"
  [current]="route.notForRole() ? null : route.current()"
  [staff]="staff()"
  [environment]="environment()"
  (signOut)="signOut()"
  (jump)="jump.open()"
>
  @if (route.notForRole(); as role) {
    <jb-admin-only-page [role]="role" (signOut)="signOut()" />
  } @else {
    <router-outlet />
  }
</jb-admin-shell>
