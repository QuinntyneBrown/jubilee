<jb-dialog
  heading="{{ wording().title }}"
  description="{{ wording().text }}"
  [icon]="data.kind === 'take-down' ? 'trash' : 'shield'"
  [tone]="data.kind === 'take-down' ? 'danger' : 'info'"
  [busy]="busy()"
  (closed)="close()"
>
  <form jb-dialog-body class="stack" id="report-action-form" novalidate (ngSubmit)="send()">
    @if (view() === 'failed') {
      <div jb-alert tone="danger" heading="We couldn’t save that action" role="alert">
        <div>Nothing was changed and your note is kept. Try again.</div>
      </div>
    }
    @if (wording().messages) {
      <div
        jb-field
        [label]="wording().messageLabel ?? 'Message'"
        controlId="r-text"
        required
        [counter]="counter()"
        [error]="textProblem() ? (wording().messageMissing ?? 'Write the message to send.') : null"
      >
        <textarea
          jb-textarea
          name="messageText"
          rows="4"
          required
          [attr.maxlength]="wording().messageMax ?? null"
          [readOnly]="busy()"
          [ngModel]="text()"
          (ngModelChange)="text.set($event)"
        ></textarea>
      </div>
    }
    <div
      jb-field
      label="Resolution note"
      controlId="r-note"
      required
      [hint]="wording().noteHint ?? noteHint"
      [error]="noteProblem() ? 'Write a note about what you decided and why.' : null"
    >
      <textarea
        jb-textarea
        name="resolutionNote"
        rows="3"
        required
        [readOnly]="busy()"
        [ngModel]="note()"
        (ngModelChange)="note.set($event)"
      ></textarea>
    </div>
  </form>
  <div jb-dialog-footer>
    <button jb-button type="button" [disabled]="busy()" (click)="close()">Cancel</button>
    <button
      jb-button
      [variant]="wording().danger ? 'danger' : 'primary'"
      type="submit"
      form="report-action-form"
      [disabled]="busy()"
      [busy]="busy()"
    >
      {{ wording().cta }}
    </button>
  </div>
</jb-dialog>
