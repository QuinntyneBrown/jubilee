<jb-dialog
  heading="Approve and publish {{ data.name }}?"
  description="It goes live in {{ data.category }} straight away with the Verified mark, and {{
    data.ownerFirstName
  }} is e-mailed."
  icon="check"
  [busy]="busy()"
  (closed)="close()"
>
  @if (view() === 'failed' || data.unticked > 0) {
    <div jb-dialog-body class="stack">
      @if (view() === 'failed') {
        <div jb-alert tone="danger" heading="We couldn’t publish it" role="alert">
          <div>The listing is still in the queue. Try again.</div>
        </div>
      }
      @if (data.unticked > 0) {
        <div
          jb-alert
          tone="warning"
          [heading]="
            data.unticked +
            ' checklist ' +
            (data.unticked === 1 ? 'item is' : 'items are') +
            ' not ticked'
          "
        >
          <div>Say why you are approving anyway. The note is kept in the audit log.</div>
        </div>
        <div
          jb-field
          label="Note"
          controlId="a-note"
          required
          [error]="invalid() ? 'Say why you are approving with items unticked.' : null"
        >
          <textarea
            jb-textarea
            name="note"
            rows="3"
            required
            [readOnly]="busy()"
            [ngModel]="note()"
            (ngModelChange)="note.set($event)"
          ></textarea>
        </div>
      }
    </div>
  }
  <div jb-dialog-footer>
    <button jb-button type="button" cdkFocusInitial [disabled]="busy()" (click)="close()">
      Not yet
    </button>
    <button
      jb-button
      variant="primary"
      type="button"
      [disabled]="busy()"
      [busy]="busy()"
      (click)="approve()"
    >
      {{ view() === 'failed' ? 'Try again' : 'Approve and publish' }}
    </button>
  </div>
</jb-dialog>
