<jb-dialog
  heading="Ask {{ data.ownerFirstName }} for changes"
  description="The listing stays unpublished and comes back to the queue when they resubmit."
  icon="edit"
  [busy]="busy()"
  (closed)="close()"
>
  <form jb-dialog-body class="stack" id="changes-form" novalidate (ngSubmit)="send()">
    @if (view() === 'failed') {
      <div jb-alert tone="danger" heading="We couldn’t send the request" role="alert">
        <div>Nothing was sent and your message is kept. Try again.</div>
      </div>
    }
    <fieldset>
      <legend>What needs to change?</legend>
      @for (area of areas; track area.key) {
        <div>
          <jb-checkbox
            [name]="'area-' + area.key"
            [checked]="chosen().includes(area.key)"
            [disabled]="busy()"
            [invalid]="!!(areaProblem() && $first)"
            [describedBy]="areaProblem() && $first ? 'areas-error' : null"
            (checkedChange)="toggle(area.key, $event)"
            >{{ area.label }}</jb-checkbox
          >
        </div>
      }
      @if (areaProblem()) {
        <span jb-field-error id="areas-error">Choose at least one thing to change.</span>
      }
    </fieldset>
    <div
      jb-field
      [label]="'Message to ' + data.ownerFirstName"
      controlId="d-msg"
      required
      hint="Sent by e-mail and shown on their My business page."
      [error]="messageProblem() ? 'Tell the owner exactly what to change.' : null"
    >
      <textarea
        jb-textarea
        name="message"
        rows="4"
        required
        [readOnly]="busy()"
        [ngModel]="message()"
        (ngModelChange)="message.set($event)"
      ></textarea>
    </div>
  </form>
  <div jb-dialog-footer>
    <button jb-button type="button" [disabled]="busy()" (click)="close()">Cancel</button>
    <button
      jb-button
      variant="primary"
      type="submit"
      form="changes-form"
      [disabled]="busy()"
      [busy]="busy()"
    >
      Send request
    </button>
  </div>
</jb-dialog>
