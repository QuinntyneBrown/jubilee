<jb-dialog
  heading="Take down {{ data.name }}?"
  description="It leaves Jubilee straight away and {{
    data.ownerFirstName
  }} is e-mailed your reason. Use this when a listing misrepresents a business."
  icon="alert"
  [busy]="busy()"
  (closed)="close()"
>
  <form jb-dialog-body class="stack" id="take-down-form" novalidate (ngSubmit)="send()">
    @if (view() === 'failed') {
      <div jb-alert tone="danger" heading="We couldn’t take it down." role="alert">
        <div>The listing is still live. Try again.</div>
      </div>
    }
    <div
      jb-field
      [label]="'Reason for ' + data.ownerFirstName"
      controlId="t-reason"
      required
      [hint]="
        'Sent to ' +
        data.ownerFirstName +
        ' by e-mail. Be kind and specific. 1,000 characters at most.'
      "
      [error]="problem() ? 'Tell the owner why it was taken down.' : null"
    >
      <textarea
        jb-textarea
        name="reason"
        rows="4"
        maxlength="1000"
        required
        [readOnly]="busy()"
        [ngModel]="reason()"
        (ngModelChange)="reason.set($event)"
      ></textarea>
    </div>
  </form>
  <div jb-dialog-footer>
    <button jb-button type="button" [disabled]="busy()" (click)="close()">Keep it</button>
    <button
      jb-button
      variant="danger"
      type="submit"
      form="take-down-form"
      [disabled]="busy()"
      [busy]="busy()"
    >
      Take down listing
    </button>
  </div>
</jb-dialog>
