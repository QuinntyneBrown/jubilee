<div class="row__body">
  <div jb-row-title>{{ service().name }}</div>
  <div jb-row-meta>{{ service().detail }}</div>
</div>
<span jb-row-price [free]="service().priceKind === 'free'">{{ price() }}</span>
<a
  jb-button
  size="sm"
  [routerLink]="actionLink()"
  [queryParams]="{ service: service().id }"
  [attr.aria-label]="label() + ' ' + service().name"
  >{{ label() }}</a
>
