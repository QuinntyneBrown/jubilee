@if (split()) {
  <aside class="auth-layout__panel" [attr.aria-label]="panelLabel()">
    <a jb-lockup size="xl" onInk [routerLink]="homeLink()" [attr.aria-label]="homeLabel()"></a>
    <div class="auth-layout__pitch">
      <p class="auth-layout__headline">{{ panelHeadline() }}</p>
      <p class="auth-layout__lead">{{ panelLead() }}</p>
    </div>
    <p class="auth-layout__legal">© Jubilee · Toronto</p>
  </aside>
}
<div class="auth-layout__body">
  <a
    jb-lockup
    class="auth-brand"
    [size]="split() ? 'lg' : 'md'"
    [routerLink]="homeLink()"
    [attr.aria-label]="homeLabel()"
  ></a>
  <div class="auth-card">
    @if (heading(); as heading) {
      <div class="auth-card__head">
        <h1 class="auth-card__title">{{ heading }}</h1>
        @if (lead(); as lead) {
          <p class="auth-card__lead">{{ lead }}</p>
        }
      </div>
    }
    <ng-content />
    <p class="auth-card__note"><ng-content select="[slot=note]" /></p>
  </div>
  <p class="auth-foot"><ng-content select="[slot=foot]" /></p>
</div>
