<a
  jb-lockup
  onInk
  class="topbar__brand"
  aria-label="jubilee"
  [routerLink]="member() ? '/' : '/welcome'"
></a>
<form
  jb-search-field
  label="Search businesses and products"
  placeholder="Plumber, lawyer, Bibles…"
  [maxLength]="100"
  [value]="query()"
  [disabled]="offline()"
  disabledReason="Search needs a connection. It works again when you’re back online."
  (searched)="searched.emit($event.trim())"
></form>
<span class="topbar__spacer"></span>
@if (member(); as member) {
  <nav class="topbar__nav" aria-label="Primary">
    <a class="nav-link" routerLink="/" [attr.aria-current]="current() === 'browse' ? 'page' : null"
      >Browse</a
    >
    <a
      class="nav-link"
      routerLink="/messages"
      [attr.aria-current]="current() === 'messages' ? 'page' : null"
      >Messages
      @if (member.unreadConversationCount > 0) {
        <span
          jb-badge
          [count]="member.unreadConversationCount"
          [label]="member.unreadConversationCount + ' unread'"
        ></span>
      }
    </a>
  </nav>
  @if (member.ownsListing) {
    <a
      jb-button
      variant="primary"
      size="sm"
      class="only-desktop"
      routerLink="/my-business"
      [attr.aria-current]="current() === 'business' ? 'page' : null"
      ><svg jb-icon name="store"></svg>My business</a
    >
  } @else {
    <a jb-button variant="primary" size="sm" class="only-desktop" routerLink="/list"
      ><svg jb-icon name="plus"></svg>List your business</a
    >
  }
  <a jb-button variant="ghost" iconOnly class="only-narrow" routerLink="/search" aria-label="Search"
    ><svg jb-icon name="search"></svg
  ></a>
  <a
    jb-button
    variant="ghost"
    iconOnly
    routerLink="/notifications"
    [attr.aria-current]="current() === 'notifications' ? 'page' : null"
    [attr.aria-label]="
      member.unreadNotificationCount > 0
        ? 'Notifications, ' + member.unreadNotificationCount + ' unread'
        : 'Notifications'
    "
    ><svg jb-icon name="bell"></svg>
    @if (member.unreadNotificationCount > 0) {
      <span class="topbar__dot" aria-hidden="true"></span>
    }
  </a>
  <!-- The initials are decoration; the name of the link is the hidden sentence (WCAG 2.5.3). -->
  <button
    #avatar
    jb-avatar
    size="sm"
    brand
    class="only-desktop"
    type="button"
    aria-haspopup="dialog"
    (click)="accountMenu.emit(avatar.element)"
  >
    <span aria-hidden="true">{{ member.initials }}</span
    ><span class="visually-hidden">Account menu for {{ member.displayName }}</span>
  </button>
} @else {
  <nav class="topbar__nav" aria-label="Primary">
    <a class="nav-link" routerLink="/" [attr.aria-current]="current() === 'browse' ? 'page' : null"
      >Browse</a
    >
    <a class="nav-link" routerLink="/sign-in">Sign in</a>
  </nav>
  <a jb-button variant="ghost" iconOnly class="only-narrow" routerLink="/search" aria-label="Search"
    ><svg jb-icon name="search"></svg
  ></a>
  <a jb-button variant="primary" size="sm" routerLink="/join">Join free</a>
}
