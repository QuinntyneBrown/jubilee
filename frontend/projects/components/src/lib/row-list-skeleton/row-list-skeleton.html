@for (row of rows(); track row) {
  <li jb-row>
    @if (leading() === 'avatar') {
      <span jb-skeleton slot="leading" shape="avatar"></span>
    }
    @if (leading() === 'thumb') {
      <span jb-skeleton slot="leading"></span>
    }
    <span jb-skeleton shape="text" width="50"></span>
    <span jb-skeleton shape="text" [width]="detail()"></span>
    @if (action()) {
      <span jb-skeleton slot="trailing" shape="button" size="sm"></span>
    }
  </li>
}
