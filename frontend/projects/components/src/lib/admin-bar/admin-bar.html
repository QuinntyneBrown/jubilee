<a jb-lockup onInk class="topbar__brand" aria-label="jubilee admin" routerLink="/listings"
  ><span class="admin-bar__tag" aria-hidden="true">admin</span></a
>
@if (staff(); as staff) {
  @if (moderator()) {
    <nav class="admin-bar__nav" aria-label="Staff">
      <a
        class="nav-link"
        routerLink="/listings"
        [attr.aria-current]="current() === 'listings' ? 'page' : null"
        >Listings</a
      >
      <a
        class="nav-link"
        routerLink="/reports"
        [attr.aria-current]="current() === 'reports' ? 'page' : null"
        >Reports
        @if (staff.reportCount > 0) {
          <span
            jb-badge
            [count]="staff.reportCount"
            [label]="staff.reportCount + ' unresolved'"
          ></span>
        }
      </a>
      <a
        class="nav-link"
        routerLink="/featured"
        [attr.aria-current]="current() === 'featured' ? 'page' : null"
        >Featured</a
      >
    </nav>
  }
  <span class="topbar__spacer"></span>
  <span class="admin-bar__staff">
    <span class="admin-bar__name">{{ staff.displayName }}</span>
    <span class="admin-bar__role">{{ roleNames() }}</span>
  </span>
  <button jb-button variant="ghost" size="sm" type="button" (click)="signOut.emit()">
    Sign out
  </button>
}
