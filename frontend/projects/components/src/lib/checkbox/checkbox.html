<label class="choice">
  <input
    type="checkbox"
    [attr.id]="controlId()"
    [attr.name]="name()"
    [checked]="checked()"
    [disabled]="disabled()"
    [attr.aria-invalid]="invalid() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    (change)="toggle($event)"
  />
  <span class="choice__text"
    ><ng-content />
    @if (hint(); as hint) {
      <small>{{ hint }}</small>
    }
  </span>
</label>
