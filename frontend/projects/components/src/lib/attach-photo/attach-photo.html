<input
  #file
  type="file"
  accept="image/jpeg,image/png"
  hidden
  tabindex="-1"
  aria-hidden="true"
  (change)="choose()"
/>
@if (preview(); as src) {
  <img class="attach__preview" [src]="src" alt="Photo to send" />
  <button class="attach__remove" type="button" aria-label="Remove photo" (click)="remove()">
    <svg jb-icon name="close" size="sm"></svg>
  </button>
} @else {
  <button
    #trigger
    jb-button
    variant="ghost"
    iconOnly
    type="button"
    aria-label="Attach a photo"
    [disabled]="disabled()"
    (click)="open()"
  >
    <svg jb-icon name="image"></svg>
  </button>
}
