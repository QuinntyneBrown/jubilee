@for (toast of toasts.toasts(); track toast.id) {
  <div
    jb-toast
    [tone]="toast.tone"
    [heading]="toast.title"
    [text]="toast.text"
    [actionLabel]="toast.action?.label"
    [duration]="toast.durationMs"
    [paused]="toast.paused"
    (action)="toasts.act(toast.id)"
    (dismiss)="toasts.dismiss(toast.id)"
    (hold)="toasts.pause(toast.id)"
    (release)="toasts.resume(toast.id)"
  ></div>
}
