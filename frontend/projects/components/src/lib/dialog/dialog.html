<div
  class="dialog__panel"
  [class.dialog__panel--sm]="size() === 'sm'"
  [class.dialog__panel--lg]="size() === 'lg'"
>
  <div class="dialog__header">
    @if (icon(); as icon) {
      <div class="dialog__icon" [class]="'dialog__icon--' + tone()" aria-hidden="true">
        <svg jb-icon [name]="icon"></svg>
      </div>
    }
    <div class="dialog__heading">
      <h2 class="dialog__title" [id]="titleId()">{{ heading() }}</h2>
      <p class="dialog__desc" [id]="descriptionId()">
        @if (description(); as description) {
          {{ description }}
        }
        <ng-content select="[slot=description]" />
      </p>
      <ng-content select="[slot=status]" />
    </div>
    <button
      jb-button
      variant="ghost"
      iconOnly
      type="button"
      aria-label="Close"
      [disabled]="busy()"
      (click)="closed.emit()"
    >
      <svg jb-icon name="close"></svg>
    </button>
  </div>
  <ng-content />
</div>
