<span class="mkt-card__media">
  <img class="mkt-card__photo" [src]="business().photo" alt="" />
  <span class="mkt-card__tag">{{ business().tag }}</span>
</span>
<span class="mkt-card__body">
  <span class="mkt-card__name">{{ business().name }}</span>
  <span class="mkt-card__tagline">{{ business().tagline }}</span>
  <span class="mkt-card__meta">
    @if (business().highlight; as highlight) {
      <span class="mkt-card__highlight">{{ highlight }}</span>
    }
  </span>
</span>
