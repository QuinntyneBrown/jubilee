<jb-auth-layout>
  <div jb-empty-state icon="wifi-off" heading="You’re offline" [level]="1">
    Jubilee needs a connection to load this page. Messages you already opened are still readable,
    and anything you send is kept and delivered when you’re back.
    <button slot="actions" jb-button variant="primary" type="button" (click)="tryAgain()">
      <svg jb-icon name="refresh"></svg>Try again
    </button>
    <a slot="actions" jb-button routerLink="/messages">Open messages</a>
  </div>
</jb-auth-layout>
