<jb-status-page icon="lock" heading="You don’t have access to this page">
  This area is for the owner of the listing or the Jubilee verification team. If you think you
  should see it, ask us.
  <a slot="actions" jb-button variant="primary" routerLink="/">Back to browse</a>
  <button
    slot="actions"
    jb-button
    type="button"
    [disabled]="state() !== 'idle'"
    [busy]="state() === 'sending'"
    (click)="ask()"
  >
    {{ state() === 'sent' ? 'Requested ✓' : 'Ask for access' }}
  </button>
</jb-status-page>
