@let current = state();
@switch (current.status) {
  @case ('loaded') {
    <div class="stack">
      <nav
        jb-breadcrumb
        [items]="[{ label: 'Browse', link: '/' }, { label: current.value.title }]"
      ></nav>
      <article
        jb-policy-document
        [heading]="current.value.title"
        [lead]="current.value.lead"
        [sections]="sections(current.value)"
        [updated]="current.value.publishedAt"
      ></article>
    </div>
  }
  @case ('error') {
    <div jb-empty-state [error]="true" icon="alert" heading="We couldn’t load this page">
      Nothing is lost. Check your connection and try again. If it keeps happening, tell us and quote
      <code>{{ current.reference }}</code
      >.
      <button slot="actions" jb-button variant="primary" type="button" (click)="load()">
        <svg jb-icon name="refresh"></svg>Try again
      </button>
      <a slot="actions" jb-button routerLink="/">Back to browse</a>
    </div>
  }
  @default {
    <div class="stack" style="max-width: 42rem; margin-top: var(--space-6)" aria-hidden="true">
      <span jb-skeleton shape="text" width="50"></span>
      <span jb-skeleton shape="text"></span>
      <span jb-skeleton shape="text" width="70"></span>
    </div>
  }
}
