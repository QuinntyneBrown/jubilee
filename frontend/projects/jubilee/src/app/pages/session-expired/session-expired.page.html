<a class="auth-brand" routerLink="/welcome"><svg jb-brand-mark></svg>jubilee</a>
<div jb-card class="auth-card">

    For your safety we sign you out after 30 days, or when your password changes. Sign in to pick up
    where you left off; drafts are kept.
    <a slot="actions" jb-button variant="primary" routerLink="/sign-in" [queryParams]="signInQuery"
      >Sign in</a
    >
  </div>
</div>
