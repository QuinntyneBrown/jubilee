<a class="auth-brand" routerLink="/welcome"><svg jb-brand-mark></svg>jubilee</a>
<div class="auth-card card stack">
  <h1>One more step</h1>
  <p class="text-muted">Joining with Google. Agree to continue.</p>
  @if (invalid()) {
    <jb-form-summary
      [errors]="[{ id: 'agree', text: 'Agree to the statement of faith to join' }]"
    />
  }
  @if (failed()) {
    <div jb-alert tone="danger" role="alert">We couldn’t save that. Try again.</div>
  }
  <form class="stack" novalidate (submit)="$event.preventDefault(); submit()">
    <div>
      <label class="choice">
        <input
          type="checkbox"
          id="agree"
          [checked]="agreed()"
          (change)="agreed.set($any($event.target).checked)"
          [attr.aria-invalid]="invalid() ? 'true' : null"
          [attr.aria-describedby]="invalid() ? 'agree-error' : null"
        />
        <span class="choice__text"
          >I am 18 or older and I agree to Jubilee’s
          <a href="/statement-of-faith" target="_blank" rel="noopener">statement of faith</a> and
          <a href="/terms" target="_blank" rel="noopener">terms</a>.</span
        >
      </label>
      @if (invalid()) {
        <span jb-field-error id="agree-error">Agree to the statement of faith to join.</span>
      }
    </div>
    <button jb-button variant="primary" block size="lg" type="submit" [busy]="busy()">
      Continue
    </button>
  </form>
</div>
