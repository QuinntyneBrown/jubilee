<a class="auth-brand" routerLink="/welcome"><svg jb-brand-mark></svg>jubilee</a>
<div jb-card class="auth-card">
  <div jb-empty-state icon="alert" heading="Something went wrong on our side" [level]="1">
    Your messages and requests are safe. Try again in a minute; if it keeps happening, tell us and
    quote the reference below.
    <button slot="actions" jb-button variant="primary" type="button" (click)="tryAgain()">
      <svg jb-icon name="refresh"></svg>Try again
    </button>
    <a slot="actions" jb-button routerLink="/help">Get help</a>
  </div>
  @if (reference) {
    <p class="text-caption">
      Reference <code>{{ reference }}</code>
    </p>
  }
</div>
