<jb-page-header [heading]="heading()" [subtitle]="subtitle()">
  @if (slug(); as slug) {
    <div class="cluster">
      <a jb-button [routerLink]="['/b', slug]">
        <svg jb-icon name="compass"></svg>{{ live() ? 'View public listing' : 'Preview listing' }}
      </a>
    </div>
  }
</jb-page-header>
<nav class="tabs" aria-label="My business sections">
  <a
    class="tab"
    routerLink="/my-business"
    [attr.aria-current]="current() === 'overview' ? 'page' : null"
    >Overview</a
  >
  <a
    class="tab"
    routerLink="/my-business/listing"
    [attr.aria-current]="current() === 'listing' ? 'page' : null"
    >Listing</a
  >
  <a
    class="tab"
    routerLink="/my-business/products"
    [attr.aria-current]="current() === 'products' ? 'page' : null"
    >Products</a
  >
  <a
    class="tab"
    routerLink="/my-business/services"
    [attr.aria-current]="current() === 'services' ? 'page' : null"
    >Services</a
  >
  <a
    class="tab"
    routerLink="/my-business/requests"
    [attr.aria-current]="current() === 'requests' ? 'page' : null"
    >Requests
    @if (openRequests() > 0) {
      <span jb-badge [count]="openRequests()" [label]="openRequests() + ' open'"></span>
    }
  </a>
</nav>
