<jb-page-header [heading]="heading()" [subtitle]="subtitle()">
  @if (slug(); as slug) {
    <div class="cluster">
      <a jb-button [routerLink]="['/b', slug]">
        <svg jb-icon name="compass"></svg>{{ live() ? 'View public listing' : 'Preview listing' }}
      </a>
    </div>
  }
</jb-page-header>
<nav jb-tabs label="My business sections" [items]="tabs()" [current]="current()"></nav>
