<a jb-skip-link>Skip to content</a>
@if (routeData().shell === 'app') {
  <header
    jb-top-bar
    [member]="member()"
    [current]="routeData().section ?? null"
    [query]="searchQuery()"
    (searched)="search($event)"
  ></header>
}
@if (routeData().shell === 'app' && unconfirmed(); as member) {
  <div
    jb-verify-email-banner
    [state]="bannerState()"
    [email]="member.email"
    [busy]="resending()"
    (resend)="resend()"
  ></div>
}
<main id="main" tabindex="-1"><router-outlet /></main>
@if (routeData().shell === 'app') {
  <footer jb-site-footer [year]="year"></footer>
  <nav jb-tab-bar [member]="member()" [current]="routeData().section ?? null"></nav>
}
<jb-toast-region />
