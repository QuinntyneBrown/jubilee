<div class="dialog__panel">
  <div class="dialog__header">
    <div class="dialog__icon dialog__icon--info" aria-hidden="true">
      <svg jb-icon name="clock"></svg>
    </div>
    <div class="dialog__heading">
      <h2 class="dialog__title" id="dlg-title">Set an away period</h2>
      <p id="dlg-desc" class="dialog__desc">
        Members who message you see that you’re away and when you’re back. Your listing stays
        public.
      </p>
    </div>
    <button
      jb-button
      variant="ghost"
      iconOnly
      type="button"
      aria-label="Close"
      [disabled]="busy()"
      (click)="close()"
    >
      <svg jb-icon name="close"></svg>
    </button>
  </div>
  <form class="dialog__body stack" id="away-form" novalidate (ngSubmit)="save()">
    @if (view() === 'failed') {
      <div jb-alert tone="danger" heading="We couldn’t save that" role="alert">
        <div>Your away period has not changed. Try again.</div>
      </div>
    }
    <div jb-field label="Back on" controlId="d-back" required [error]="problem()">
      <input
        jb-input
        name="backOn"
        type="date"
        required
        cdkFocusInitial
        [attr.min]="min"
        [attr.max]="max"
        [readOnly]="busy()"
        [ngModel]="backOn()"
        (ngModelChange)="backOn.set($event)"
      />
    </div>
  </form>
  <div class="dialog__footer">
    @if (data.awayUntil) {
      <button jb-button variant="ghost" type="button" [disabled]="busy()" (click)="clear()">
        Clear away period
      </button>
    }
    <button jb-button type="button" [disabled]="busy()" (click)="close()">Cancel</button>
    <button jb-button variant="primary" type="submit" form="away-form" [busy]="busy()">Save</button>
  </div>
</div>
