<div class="dialog__panel">
  <div class="dialog__header">
    <div class="dialog__icon dialog__icon--info" aria-hidden="true">
      <svg jb-icon name="message"></svg>
    </div>
    <div style="flex: 1">
      <h2 class="dialog__title" id="dlg-title">Message {{ data.businessName }}</h2>
      <p id="dlg-desc" class="text-muted" style="margin-top: var(--space-1)">
        {{ data.intro }} The conversation continues in Messages.
      </p>
    </div>
    <button
      jb-button
      variant="ghost"
      iconOnly
      type="button"
      aria-label="Close"
      [disabled]="busy()"
      (click)="close()"
    >
      <svg jb-icon name="close"></svg>
    </button>
  </div>
  <form class="dialog__body stack" (ngSubmit)="send()" id="new-message-form">
    @if (view() === 'failed') {
      <div jb-alert tone="danger" [heading]="failure().title" role="alert">
        <div>{{ failure().text }}</div>
      </div>
    }
    <div
      jb-field
      label="Your message"
      controlId="d-msg"
      required
      [hint]="'Be specific and ' + data.businessName + ' can answer in one reply.'"
      [error]="view() === 'invalid' ? error() : null"
    >
      <textarea
        class="textarea"
        jbFieldControl
        name="message"
        rows="5"
        cdkFocusInitial
        required
        [readOnly]="busy()"
        [ngModel]="text()"
        (ngModelChange)="text.set($event)"
      ></textarea>
    </div>
  </form>
  <div class="dialog__footer">
    <button jb-button type="button" [disabled]="busy()" (click)="close()">Cancel</button>
    <button jb-button variant="primary" type="submit" form="new-message-form" [busy]="busy()">
      Send message
    </button>
  </div>
</div>
