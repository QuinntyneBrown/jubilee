<jb-dialog
  heading="Message {{ data.businessName }}"
  description="{{ data.intro }} The conversation continues in Messages."
  icon="message"
  [busy]="busy()"
  (closed)="close()"
  (outsideClick)="close()"
>
  <form jb-dialog-body class="stack" jbDraft="message" (ngSubmit)="send()" id="new-message-form">
    @if (view() === 'failed') {
      <div jb-alert tone="danger" [heading]="failure().title" role="alert">
        <div>{{ failure().text }}</div>
      </div>
    }
    <div
      jb-field
      label="Your message"
      controlId="d-msg"
      required
      [hint]="'Be specific and ' + data.answeredBy + ' can answer in one reply.'"
      [counter]="counter()"
      [error]="view() === 'invalid' ? error() : null"
    >
      <textarea
        jb-textarea
        name="message"
        rows="5"
        cdkFocusInitial
        required
        [attr.maxlength]="max"
        [readOnly]="busy()"
        [ngModel]="text()"
        (ngModelChange)="text.set($event)"
      ></textarea>
    </div>
  </form>
  <div jb-dialog-footer>
    <button jb-button type="button" [disabled]="busy()" (click)="close()">Cancel</button>
    <button jb-button variant="primary" type="submit" form="new-message-form" [busy]="busy()">
      Send message
    </button>
  </div>
</jb-dialog>
