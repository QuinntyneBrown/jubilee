<div class="dialog__panel">
  <div class="dialog__header">
    <div style="flex: 1"><h2 class="dialog__title" id="filters-title">Filters</h2></div>
    <button jb-button variant="ghost" iconOnly type="button" aria-label="Close" (click)="close()">
      <svg jb-icon name="close"></svg>
    </button>
  </div>
  <div class="dialog__body stack">
    <fieldset>
      <legend>Offers</legend>
      @for (offer of offerOptions; track offer.value) {
        <div>
          <jb-checkbox
            [checked]="offers().includes(offer.value)"
            (checkedChange)="toggleOffer(offer.value, $event)"
            >{{ offer.label }}</jb-checkbox
          >
        </div>
      }
    </fieldset>
    <fieldset>
      <legend>Area served</legend>
      @for (area of areaOptions; track area.value) {
        <div>
          <jb-checkbox
            [checked]="areas().includes(area.value)"
            (checkedChange)="toggleArea(area.value, $event)"
            >{{ area.label }}</jb-checkbox
          >
        </div>
      }
    </fieldset>
    <div jb-field label="Sort" controlId="filters-sort">
      <select jb-select #sortBox (change)="setSort(sortBox.element.value)">
        @for (option of sortOptions; track option.value) {
          <option [value]="option.value" [selected]="option.value === sort()">
            {{ option.label }}
          </option>
        }
      </select>
    </div>
  </div>
  <div class="dialog__footer">
    <button jb-button type="button" (click)="clearAll()">Clear all</button>
    <button jb-button variant="primary" type="button" cdkFocusInitial (click)="apply()">
      Show {{ count() | jbCount }} {{ count() === 1 ? 'business' : 'businesses' }}
    </button>
  </div>
</div>
