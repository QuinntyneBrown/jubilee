<div class="dialog__panel">
  <div class="dialog__header">
    <div class="dialog__icon dialog__icon--info" aria-hidden="true">
      <svg jb-icon name="sign-out"></svg>
    </div>
    <div style="flex: 1">
      <h2 class="dialog__title" id="dlg-title">Sign out of Jubilee?</h2>
      <p id="dlg-desc" class="text-muted" style="margin-top: var(--space-1)">
        You’ll stay signed in on your other device. An unsent message draft is kept on this phone.
      </p>
      @if (failed()) {
        <p class="field__error" role="alert">We couldn’t sign you out. Try again.</p>
      }
    </div>
    <button class="btn btn--ghost btn--icon" type="button" aria-label="Close" (click)="close()">
      <svg jb-icon name="close"></svg>
    </button>
  </div>
  <div class="dialog__footer">
    <button class="btn" type="button" cdkFocusInitial [disabled]="busy()" (click)="close()">
      Stay signed in
    </button>
    <button
      class="btn btn--primary"
      type="button"
      [attr.aria-busy]="busy() ? 'true' : null"
      (click)="confirm()"
    >
      Sign out
    </button>
  </div>
</div>
