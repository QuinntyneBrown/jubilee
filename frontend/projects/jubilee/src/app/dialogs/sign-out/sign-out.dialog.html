<jb-dialog
  heading="Sign out of Jubilee?"
  description="You’ll stay signed in on your other device. An unsent message draft is kept on this phone."
  icon="sign-out"
  (closed)="close()"
  (outsideClick)="close()"
>
  @if (failed()) {
    <p jb-field-error slot="status" role="alert">We couldn’t sign you out. Try again.</p>
  }
  <div jb-dialog-footer>
    <button jb-button type="button" cdkFocusInitial [disabled]="busy()" (click)="close()">
      Stay signed in
    </button>
    <button jb-button variant="primary" type="button" [busy]="busy()" (click)="confirm()">
      Sign out
    </button>
  </div>
</jb-dialog>
