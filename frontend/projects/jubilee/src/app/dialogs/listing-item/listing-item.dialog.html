<jb-dialog
  heading="{{ isService ? 'Add a service' : 'Add a product' }}"
  description="It is kept in your draft. Nothing is public until you submit and are verified."
  [icon]="isService ? 'calendar' : 'bag'"
  (closed)="close()"
  (outsideClick)="close()"
>
  <form jb-dialog-body class="stack" id="item-form" novalidate (ngSubmit)="add()">
    <div
      jb-field
      [label]="isService ? 'Service name' : 'Product name'"
      controlId="d-name"
      required
      [error]="nameProblem()"
    >
      <input
        jb-input
        name="name"
        type="text"
        maxlength="120"
        required
        cdkFocusInitial
        [ngModel]="name()"
        (ngModelChange)="name.set($event)"
      />
    </div>
    @if (isService) {
      <div
        jb-field
        label="Short detail"
        controlId="d-meta"
        optional
        hint="Length, place or what to bring. 60 characters at most."
      >
        <input
          jb-input
          name="detail"
          type="text"
          maxlength="60"
          [ngModel]="detail()"
          (ngModelChange)="detail.set($event)"
        />
      </div>
      <div jb-field label="Pricing" controlId="d-pricing">
        <select
          jb-select
          name="pricing"
          [ngModel]="pricing()"
          (ngModelChange)="pricing.set($event)"
        >
          <option value="free">Free</option>
          <option value="amount">Fixed price</option>
          <option value="ask">Ask for a quote</option>
        </select>
      </div>
    }
    @if (!isService || pricing() === 'amount') {
      <div jb-field label="Price (CAD)" controlId="d-price" required [error]="priceProblem()">
        <input
          jb-input
          name="price"
          type="text"
          inputmode="decimal"
          [ngModel]="price()"
          (ngModelChange)="price.set($event)"
        />
      </div>
    }
  </form>
  <div jb-dialog-footer>
    <button jb-button type="button" (click)="close()">Cancel</button>
    <button jb-button variant="primary" type="submit" form="item-form">
      {{ isService ? 'Add service' : 'Add product' }}
    </button>
  </div>
</jb-dialog>
