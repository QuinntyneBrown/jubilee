<jb-dialog
  heading="Share {{ data.businessName }}"
  description="Send this listing to a friend or your small group."
  icon="share"
  size="sm"
  (closed)="close()"
>
  <div jb-dialog-body class="stack">
    <div jb-field label="Link" controlId="d-link">
      <jb-input-group>
        <input jb-input type="text" [value]="url" readonly />
        <button slot="suffix" jb-button variant="primary" type="button" (click)="copy()">
          {{ copied() ? 'Copied ✓' : 'Copy' }}
        </button>
      </jb-input-group>
      <span class="visually-hidden" role="status" aria-live="polite">{{
        copied() ? 'Link copied' : ''
      }}</span>
    </div>
    <div class="cluster">
      <a jb-button [href]="mailto">E-mail</a>
      <a jb-button [href]="whatsapp" target="_blank" rel="noopener noreferrer">WhatsApp</a>
      @if (canShare) {
        <button jb-button type="button" (click)="more()">More…</button>
      }
    </div>
  </div>
  <div jb-dialog-footer>
    <button jb-button type="button" cdkFocusInitial (click)="close()">Done</button>
  </div>
</jb-dialog>
