<jb-dialog
  heading="Delete “{{ data.name }}”?"
  description="{{ consequence() }}"
  icon="alert"
  tone="danger"
  [busy]="busy()"
  (closed)="close()"
>
  @if (view() === 'failed') {
    <div jb-dialog-body class="stack">
      <div jb-alert tone="danger" heading="We couldn’t delete it" role="alert">
        <div>The {{ data.kind }} is still listed. Try again.</div>
      </div>
    </div>
  }
  <div jb-dialog-footer>
    <button jb-button type="button" cdkFocusInitial [disabled]="busy()" (click)="close()">
      Keep {{ data.kind }}
    </button>
    <button
      jb-button
      variant="danger"
      type="button"
      [disabled]="busy()"
      [busy]="busy()"
      (click)="delete()"
    >
      {{ view() === 'failed' ? 'Try again' : 'Delete ' + data.kind }}
    </button>
  </div>
</jb-dialog>
