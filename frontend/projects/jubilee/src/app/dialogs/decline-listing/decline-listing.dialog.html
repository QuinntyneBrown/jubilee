<jb-dialog
  heading="Decline {{ data.name }}?"
  description="The listing is closed and {{
    data.ownerFirstName
  }} is e-mailed your reason. Use this when the church reference could not vouch for them."
  icon="alert"
  [busy]="busy()"
  (closed)="close()"
>
  <form jb-dialog-body class="stack" id="decline-form" novalidate (ngSubmit)="send()">
    @if (view() === 'failed') {
      <div jb-alert tone="danger" heading="We couldn’t decline the listing" role="alert">
        <div>Nothing was sent and your reason is kept. Try again.</div>
      </div>
    }
    <div
      jb-field
      [label]="'Reason for ' + data.ownerFirstName"
      controlId="d-reason"
      required
      hint="Sent by e-mail and shown on their My business page. Be kind and specific."
      [error]="problem() ? 'Tell the owner why the listing was declined.' : null"
    >
      <textarea
        jb-textarea
        name="reason"
        rows="4"
        required
        [readOnly]="busy()"
        [ngModel]="reason()"
        (ngModelChange)="reason.set($event)"
      ></textarea>
    </div>
  </form>
  <div jb-dialog-footer>
    <button jb-button type="button" [disabled]="busy()" (click)="close()">Cancel</button>
    <button
      jb-button
      variant="danger"
      type="submit"
      form="decline-form"
      [disabled]="busy()"
      [busy]="busy()"
    >
      Decline listing
    </button>
  </div>
</jb-dialog>
