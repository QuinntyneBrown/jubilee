<div class="dialog__panel">
  <div class="dialog__header">
    <div class="dialog__icon dialog__icon--info" aria-hidden="true">
      <svg jb-icon name="alert"></svg>
    </div>
    <div style="flex: 1">
      <h2 class="dialog__title" id="dlg-title">Decline {{ data.name }}?</h2>
      <p id="dlg-desc" class="text-muted" style="margin-top: var(--space-1)">
        The listing is closed and {{ data.ownerFirstName }} is e-mailed your reason. Use this when
        the church reference could not vouch for them.
      </p>
    </div>
    <button
      jb-button
      variant="ghost"
      iconOnly
      type="button"
      aria-label="Close"
      [disabled]="busy()"
      (click)="close()"
    >
      <svg jb-icon name="close"></svg>
    </button>
  </div>
  <form class="dialog__body stack" id="decline-form" novalidate (ngSubmit)="send()">
    @if (view() === 'failed') {
      <div jb-alert tone="danger" heading="We couldn’t decline the listing" role="alert">
        <div>Nothing was sent and your reason is kept. Try again.</div>
      </div>
    }
    <div
      jb-field
      [label]="'Reason for ' + data.ownerFirstName"
      controlId="d-reason"
      required
      hint="Sent by e-mail and shown on their My business page. Be kind and specific."
      [error]="problem() ? 'Tell the owner why the listing was declined.' : null"
    >
      <textarea
        class="textarea"
        jbFieldControl
        name="reason"
        rows="4"
        required
        [readOnly]="busy()"
        [ngModel]="reason()"
        (ngModelChange)="reason.set($event)"
      ></textarea>
    </div>
  </form>
  <div class="dialog__footer">
    <button jb-button type="button" [disabled]="busy()" (click)="close()">Cancel</button>
    <button
      jb-button
      variant="danger"
      type="submit"
      form="decline-form"
      [disabled]="busy()"
      [busy]="busy()"
    >
      Decline listing
    </button>
  </div>
</div>
