<jb-dialog
  heading="Leave without saving?"
  description="You changed your profile and haven’t saved it. If you leave now, the changes are lost."
  icon="alert"
  tone="danger"
  (closed)="decide(false)"
>
  <div jb-dialog-footer>
    <button jb-button type="button" cdkFocusInitial (click)="decide(false)">Keep editing</button>
    <button jb-button variant="danger" type="button" (click)="decide(true)">
      Leave without saving
    </button>
  </div>
</jb-dialog>
