<jb-dialog heading="Account" size="sm" anchored (closed)="close()" (outsideClick)="close()">
  <div jb-dialog-body class="stack">
    <div class="cluster">
      <jb-avatar brand [initials]="data.initials" />
      <div>
        <div jb-row-title>{{ data.displayName }}</div>
        <div jb-row-meta>{{ data.email }}</div>
      </div>
    </div>
    <ul jb-menu-list>
      <li>
        <a jb-menu-link icon="user" routerLink="/account" cdkFocusInitial (click)="close()"
          >Your account
        </a>
      </li>
      <li>
        <a jb-menu-link icon="calendar" routerLink="/requests" (click)="close()">Your requests </a>
      </li>
      <li>
        <a jb-menu-link icon="heart" routerLink="/saved" (click)="close()">Saved </a>
      </li>
      <li>
        <a jb-menu-link icon="bell" routerLink="/account/notifications" (click)="close()"
          >Notifications
        </a>
      </li>
      <li>
        @if (data.ownsListing) {
          <a jb-menu-link icon="store" routerLink="/my-business" (click)="close()">My business </a>
        } @else {
          <a jb-menu-link icon="plus" routerLink="/list" (click)="close()">List your business </a>
        }
      </li>
      @if (data.isVerifier) {
        <li>
          <a jb-menu-link icon="verified" routerLink="/admin/verifications" (click)="close()"
            >Verification queue
          </a>
        </li>
      }
      <li>
        <a jb-menu-link icon="info" routerLink="/help" (click)="close()">Help </a>
      </li>
      <li>
        <button jb-menu-link icon="sign-out" type="button" (click)="signOut()">Sign out</button>
      </li>
    </ul>
  </div>
</jb-dialog>
