<jb-dialog heading="Account" size="sm" anchored (closed)="close()" (outsideClick)="close()">
  <div jb-dialog-body class="stack">
    <div class="cluster">
      <span class="avatar avatar--brand" aria-hidden="true">{{ data.initials }}</span>
      <div>
        <div class="row__title">{{ data.displayName }}</div>
        <div class="row__meta">{{ data.email }}</div>
      </div>
    </div>
    <ul class="list" style="margin-inline: calc(-1 * var(--space-3))">
      <li>
        <a class="menu__item" routerLink="/account" cdkFocusInitial (click)="close()">
          <svg jb-icon name="user"></svg>Your account
        </a>
      </li>
      <li>
        <a class="menu__item" routerLink="/requests" (click)="close()">
          <svg jb-icon name="calendar"></svg>Your requests
        </a>
      </li>
      <li>
        <a class="menu__item" routerLink="/saved" (click)="close()">
          <svg jb-icon name="heart"></svg>Saved
        </a>
      </li>
      <li>
        <a class="menu__item" routerLink="/account/notifications" (click)="close()">
          <svg jb-icon name="bell"></svg>Notifications
        </a>
      </li>
      <li>
        @if (data.ownsListing) {
          <a class="menu__item" routerLink="/my-business" (click)="close()">
            <svg jb-icon name="store"></svg>My business
          </a>
        } @else {
          <a class="menu__item" routerLink="/list" (click)="close()">
            <svg jb-icon name="plus"></svg>List your business
          </a>
        }
      </li>
      @if (data.isVerifier) {
        <li>
          <a class="menu__item" routerLink="/admin/verifications" (click)="close()">
            <svg jb-icon name="verified"></svg>Verification queue
          </a>
        </li>
      }
      <li>
        <a class="menu__item" routerLink="/help" (click)="close()">
          <svg jb-icon name="info"></svg>Help
        </a>
      </li>
      <li>
        <button class="menu__item" type="button" (click)="signOut()">
          <svg jb-icon name="sign-out"></svg>Sign out
        </button>
      </li>
    </ul>
  </div>
</jb-dialog>
