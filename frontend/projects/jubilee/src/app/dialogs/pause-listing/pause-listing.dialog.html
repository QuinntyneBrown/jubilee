<jb-dialog
  heading="Pause {{ data.business }}?"
  description="Your listing is hidden from browse and search until you resume it. Your {{
    data.openRequests
  }} open {{
    data.openRequests === 1 ? 'request' : 'requests'
  }} and your messages stay. You keep your verified status."
  icon="alert"
  tone="danger"
  [busy]="busy()"
  (closed)="close()"
>
  @if (view() === 'failed') {
    <div jb-dialog-body class="stack">
      <div jb-alert tone="danger" heading="We couldn’t pause it" role="alert">
        <div>Your listing is still live. Try again.</div>
      </div>
    </div>
  }
  <div jb-dialog-footer>
    <button jb-button type="button" cdkFocusInitial [disabled]="busy()" (click)="close()">
      Keep it live
    </button>
    <button
      jb-button
      variant="danger"
      type="button"
      [disabled]="busy()"
      [busy]="busy()"
      (click)="pause()"
    >
      {{ view() === 'failed' ? 'Try again' : 'Pause listing' }}
    </button>
  </div>
</jb-dialog>
