<div class="dialog__panel">
  <div class="dialog__header">
    <div class="dialog__icon dialog__icon--info" aria-hidden="true">
      <svg jb-icon name="shield"></svg>
    </div>
    <div style="flex: 1">
      <h2 class="dialog__title" id="dlg-title">{{ wording().title }}</h2>
      <p id="dlg-desc" class="text-muted" style="margin-top: var(--space-1)">
        {{ wording().text }}
      </p>
    </div>
    <button
      jb-button
      variant="ghost"
      iconOnly
      type="button"
      aria-label="Close"
      [disabled]="busy()"
      (click)="close()"
    >
      <svg jb-icon name="close"></svg>
    </button>
  </div>
  <form class="dialog__body stack" id="report-action-form" novalidate (ngSubmit)="send()">
    @if (view() === 'failed') {
      <div jb-alert tone="danger" heading="We couldn’t save that action" role="alert">
        <div>Nothing was changed and your note is kept. Try again.</div>
      </div>
    }
    @if (wording().messages) {
      <div
        jb-field
        label="Message"
        controlId="r-text"
        required
        [error]="textProblem() ? 'Write the message to send.' : null"
      >
        <textarea
          jb-textarea
          name="messageText"
          rows="4"
          required
          [readOnly]="busy()"
          [ngModel]="text()"
          (ngModelChange)="text.set($event)"
        ></textarea>
      </div>
    }
    <div
      jb-field
      label="Resolution note"
      controlId="r-note"
      required
      hint="Kept with the report and in the audit log. Never shown to the owner or the reporter."
      [error]="noteProblem() ? 'Write a note about what you decided and why.' : null"
    >
      <textarea
        jb-textarea
        name="resolutionNote"
        rows="3"
        required
        [readOnly]="busy()"
        [ngModel]="note()"
        (ngModelChange)="note.set($event)"
      ></textarea>
    </div>
  </form>
  <div class="dialog__footer">
    <button jb-button type="button" [disabled]="busy()" (click)="close()">Cancel</button>
    <button
      jb-button
      [variant]="wording().danger ? 'danger' : 'primary'"
      type="submit"
      form="report-action-form"
      [disabled]="busy()"
      [busy]="busy()"
    >
      {{ wording().cta }}
    </button>
  </div>
</div>
