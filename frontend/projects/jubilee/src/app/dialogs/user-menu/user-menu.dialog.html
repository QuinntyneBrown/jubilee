<div class="dialog__panel dialog__panel--sm">
  <div class="dialog__header">
    <div style="flex: 1">
      <h2 class="dialog__title" id="dlg-title">Account</h2>
    </div>
    <button class="btn btn--ghost btn--icon" type="button" aria-label="Close" (click)="close()">
      <svg jb-icon name="close"></svg>
    </button>
  </div>
  @if (member(); as signedIn) {
    <div class="dialog__body stack">
      <div class="cluster">
        <span class="avatar avatar--brand" aria-hidden="true">{{ signedIn.initials }}</span>
        <div>
          <div class="row__title">{{ signedIn.displayName }}</div>
          <div class="row__meta">{{ signedIn.email }}</div>
        </div>
      </div>
      <ul class="list" style="margin-inline: calc(-1 * var(--space-3))">
        <li>
          <a class="menu__item" routerLink="/account" cdkFocusInitial (click)="close()"
            ><svg jb-icon name="user"></svg>Your account</a
          >
        </li>
        <li>
          <a class="menu__item" routerLink="/requests" (click)="close()"
            ><svg jb-icon name="calendar"></svg>Your requests</a
          >
        </li>
        <li>
          <a class="menu__item" routerLink="/saved" (click)="close()"
            ><svg jb-icon name="heart"></svg>Saved</a
          >
        </li>
        <li>
          <a class="menu__item" routerLink="/notifications" (click)="close()"
            ><svg jb-icon name="bell"></svg>Notifications</a
          >
        </li>
        <li>
          <a class="menu__item" routerLink="/list-business" (click)="close()"
            ><svg jb-icon name="plus"></svg>List your business</a
          >
        </li>
        <li>
          <a class="menu__item" routerLink="/help" (click)="close()"
            ><svg jb-icon name="info"></svg>Help</a
          >
        </li>
        <li class="menu__divider" aria-hidden="true"></li>
        <li>
          <button class="menu__item menu__item--danger" type="button" (click)="signOut()">
            <svg jb-icon name="sign-out"></svg>Sign out
          </button>
        </li>
      </ul>
    </div>
  }
</div>
