<jb-dialog
  heading="{{ data.title }}"
  description="Jubilee is free. An account lets businesses reply to you and keeps your bookings in one place. We’ll bring you straight back here."
  icon="user"
  size="sm"
  (closed)="close()"
  (outsideClick)="close()"
>
  <div jb-dialog-footer>
    <a jb-button routerLink="/sign-in" [queryParams]="back" (click)="close()">Sign in</a>
    <a
      jb-button
      variant="primary"
      routerLink="/join"
      [queryParams]="back"
      cdkFocusInitial
      (click)="close()"
      >Join free</a
    >
  </div>
</jb-dialog>
