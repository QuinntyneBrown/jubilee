<jb-dialog
  heading="Cancel your {{ data.noun }} to {{ data.business }}?"
  icon="alert"
  tone="danger"
  [busy]="busy()"
  (closed)="close()"
>
  <span slot="description"
    >{{ data.business }} is told straight away. You can ask again later.
    @if (data.shortNotice) {
      It’s less than a day away; consider messaging {{ data.ownerFirstName }} too.
    }
  </span>
  @if (view() === 'failed') {
    <div jb-dialog-body class="stack">
      <div jb-alert tone="danger" heading="We couldn’t cancel it" role="alert">
        <div>The request is still open. Check your connection and try again.</div>
      </div>
    </div>
  }
  <div jb-dialog-footer>
    <button jb-button type="button" cdkFocusInitial [disabled]="busy()" (click)="close()">
      Keep request
    </button>
    <button
      jb-button
      variant="danger"
      type="button"
      [disabled]="busy()"
      [busy]="busy()"
      (click)="cancel()"
    >
      {{ view() === 'failed' ? 'Try again' : 'Cancel request' }}
    </button>
  </div>
</jb-dialog>
