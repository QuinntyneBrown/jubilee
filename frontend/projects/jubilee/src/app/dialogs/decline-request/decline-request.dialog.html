<jb-dialog
  heading="Decline {{ firstName }}’s {{ noun }}?"
  description="A kind, clear reason keeps the door open. {{ firstName }} can reply in Messages."
  icon="alert"
  tone="danger"
  [busy]="busy()"
  (closed)="close()"
>
  <form
    jb-dialog-body
    class="stack"
    id="decline-request-form"
    [jbDraft]="'decline:' + request.id"
    novalidate
    (ngSubmit)="send()"
  >
    @if (view() === 'failed') {
      <div jb-alert tone="danger" heading="We couldn’t send your decline" role="alert">
        <div>The request is still new and your note is kept. Try again.</div>
      </div>
    }
    <div jb-field label="Reason" controlId="d-why">
      <select
        jb-select
        name="reason"
        [disabled]="busy()"
        [ngModel]="reason()"
        (ngModelChange)="reason.set($event)"
      >
        @for (option of reasons; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>
    <div
      jb-field
      [label]="'Message to ' + firstName"
      controlId="d-msg"
      required
      hint="Shown to the customer with your decline."
      [error]="
        problem() ? 'Write a short note so ' + firstName + ' knows why and what to do next.' : null
      "
    >
      <textarea
        jb-textarea
        name="message"
        rows="3"
        required
        [attr.maxlength]="maxMessage"
        [readOnly]="busy()"
        [ngModel]="message()"
        (ngModelChange)="message.set($event)"
      ></textarea>
    </div>
  </form>
  <div jb-dialog-footer>
    <button jb-button type="button" cdkFocusInitial [disabled]="busy()" (click)="close()">
      Keep request
    </button>
    <button
      jb-button
      variant="danger"
      type="submit"
      form="decline-request-form"
      [disabled]="busy()"
      [busy]="busy()"
    >
      Decline request
    </button>
  </div>
</jb-dialog>
