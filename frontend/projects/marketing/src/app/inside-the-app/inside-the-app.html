<section jb-marketing-section id="inside" aria-labelledby="inside-title">
  <jb-marketing-heading
    split
    measure
    headingId="inside-title"
    text="Shops and services,"
    accent="side by side."
    lead="From a Sunday altar bouquet to a retirement plan, the people behind every page share your values."
  >
    <a slot="aside" jb-marketing-link [href]="browseUrl">
      See all {{ count }} businesses
      <svg jb-icon name="arrow-up-right"></svg>
    </a>
  </jb-marketing-heading>
  <ul jb-photo-card-grid>
    @for (business of cards; track business.name; let first = $first) {
      <li jb-photo-card-grid-item [lead]="first">
        <a jb-photo-business-card [business]="business" [featured]="first" [href]="browseUrl"></a>
      </li>
    }
  </ul>
</section>
