<section jb-marketing-section id="inside" aria-labelledby="inside-title">
  <jb-marketing-heading
    split
    measure
    headingId="inside-title"
    text="Shops and services,"
    accent="side by side."
    lead="From a Sunday altar bouquet to a retirement plan, the people behind every page share your values. Here is a preview of the businesses you will find."
  />
  <ul jb-photo-card-grid>
    @for (business of cards; track business.name; let first = $first) {
      <li jb-photo-card-grid-item [lead]="first">
        <div jb-photo-business-card [business]="business" [featured]="first"></div>
      </li>
    }
  </ul>
</section>
