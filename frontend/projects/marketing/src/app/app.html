<a jb-skip-link>Skip to content</a>
<header jb-marketing-nav linksLabel="Sections" [links]="sections">
  <a slot="brand" jb-lockup size="sm" href="#top" aria-label="Jubilee home"></a>
  <a slot="action" jb-marketing-button variant="pill" [href]="browseUrl">
    Open Jubilee
    <svg jb-icon name="arrow-up-right"></svg>
  </a>
</header>
<main id="main" tabindex="-1">
  <section jb-marketing-section id="top" layout="opening" aria-labelledby="top-title">
    <jb-marketing-heading
      [level]="1"
      size="display"
      headingId="top-title"
      text="Toronto’s Christian businesses,"
      accent="in one place."
      lead="Jubilee is where Toronto’s Christian community finds shops, advisors and trades it can trust. Every business is vouched for by a church, so you can shop, hire and recommend with confidence."
      leadWidth="wide"
      note="Free for members · Every business church-verified"
    >
      <a slot="actions" jb-marketing-button [href]="browseUrl">
        Start browsing
        <svg jb-icon name="arrow-up-right"></svg>
      </a>
      <a slot="actions" jb-marketing-link iconSize="sm" href="#film">
        Watch the film
        <svg jb-icon name="arrow-down"></svg>
      </a>
    </jb-marketing-heading>
    <div
      jb-app-glimpse
      label="A glimpse of the app"
      [search]="glimpse.search"
      [caption]="glimpse.caption"
      [results]="glimpse.results"
    >
      <p jb-floating-note tone="trust" icon="verified">Vouched for by Grace Toronto Church</p>
      <p jb-floating-note tone="reply" icon="message">WaterWorks replied in 12 min</p>
    </div>
  </section>

  <section jb-marketing-section id="film" layout="film" aria-labelledby="film-title">
    <jb-marketing-heading
      size="film"
      headingId="film-title"
      text="See Jubilee"
      accent="in action."
    />
    <jb-video-player
      label="Jubilee pitch film"
      playLabel="Play the Jubilee film"
      [src]="film.src"
      [still]="film.still"
      [length]="film.length"
      [chapters]="film.chapters"
    />
  </section>

  <jb-benefits />
  <jb-how-it-works />
  <jb-inside-the-app />
  <jb-for-businesses />

  <section jb-marketing-section layout="closing" aria-labelledby="closing-title">
    <jb-marketing-heading
      size="closing"
      headingId="closing-title"
      text="Your community is"
      accent="open for business."
    >
      <a slot="actions" jb-marketing-button [href]="browseUrl">
        Start browsing
        <svg jb-icon name="arrow-up-right"></svg>
      </a>
    </jb-marketing-heading>
  </section>
</main>
<footer jb-marketing-footer>
  <span slot="brand" jb-lockup size="xs" onInk role="img" aria-label="Jubilee"></span>
  Toronto’s Christian marketplace · jubilee.to
</footer>
