<a jb-skip-link>Skip to content</a>
<header jb-marketing-nav linksLabel="Sections" [links]="sections">
  <a slot="brand" jb-lockup size="sm" href="#top" aria-label="Jubilee home"></a>
  <a slot="action" jb-marketing-button variant="pill" href="#notify">
    Launching soon
    <svg jb-icon name="arrow-down"></svg>
  </a>
</header>
<main id="main" tabindex="-1">
  <section jb-marketing-section id="top" layout="opening" aria-labelledby="top-title">
    <jb-marketing-heading
      [level]="1"
      size="display"
      headingId="top-title"
      text="Toronto’s Christian businesses,"
      accent="in one place."
      lead="Jubilee is where Toronto’s Christian community will find shops, advisors and trades it can trust. We are launching soon."
      leadWidth="wide"
      note="Not open yet · Free for members at launch"
    >
      <p slot="eyebrow" jb-launch-badge>Launching soon</p>
      <a slot="actions" jb-marketing-button href="#notify">
        Tell me when it launches
        <svg jb-icon name="arrow-down"></svg>
      </a>
      <a slot="actions" jb-marketing-link iconSize="sm" href="#film">
        Watch the film
        <svg jb-icon name="arrow-down"></svg>
      </a>
    </jb-marketing-heading>
    <div
      jb-app-glimpse
      label="A preview of the app"
      [search]="glimpse.search"
      [caption]="glimpse.caption"
      [results]="glimpse.results"
    >
      <p jb-floating-note tone="trust" icon="check-circle">
        Every owner agrees to our statement of faith
      </p>
      <p jb-floating-note tone="reply" icon="message">Message a business directly</p>
    </div>
  </section>

  <section jb-marketing-section id="film" layout="film" aria-labelledby="film-title">
    <jb-marketing-heading
      size="film"
      headingId="film-title"
      text="See Jubilee"
      accent="in action."
    />
    <jb-video-player
      label="Jubilee pitch film"
      playLabel="Play the Jubilee film"
      [src]="film.src"
      [still]="film.still"
      [length]="film.length"
      [chapters]="film.chapters"
    />
  </section>

  <section jb-marketing-section id="mission" tone="ink" aria-labelledby="mission-title">
    <jb-marketing-heading
      measure
      headingId="mission-title"
      text="Our"
      accent="mission."
      [lead]="mission"
    />
  </section>

  <jb-benefits />
  <jb-how-it-works />
  <jb-inside-the-app />
  <jb-for-businesses />

  <jb-business-pre-registration />
  <jb-launch-notification />
</main>
<footer jb-marketing-footer>
  <span slot="brand" jb-lockup size="xs" onInk role="img" aria-label="Jubilee"></span>
  Toronto’s Christian marketplace · jubilee.to
</footer>
