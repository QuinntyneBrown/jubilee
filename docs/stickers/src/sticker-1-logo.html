<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jubilee sticker: logo</title>
    <link rel="stylesheet" href="stickers.css" />
  </head>
  <body>
    <div class="stage">
      <!-- Sticker 1: the stacked lockup, cut to its own outline with no backing
           shape (components/LogoSticker.tsx). The mark keeps its 100-unit source
           coordinates under translate(285.4 167) scale(3.4). -->
      <svg class="sticker" viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg">
        <title>Jubilee logo sticker</title>
        <g transform="translate(0 22)">
          <!-- Die cut -->
          <g id="cut">
            <g transform="translate(285.4 167) scale(3.4)">
              <path class="keyline keyline-open" d="M60 8 V60 A20 20 0 0 1 20 60 V38" stroke-width="52.735" />
              <path class="keyline keyline-open" d="M36 27 H84" stroke-width="52.735" />
            </g>
            <text
              class="keyline wide"
              x="450"
              y="637"
              text-anchor="middle"
              font-family="'Archivo'"
              font-weight="700"
              font-size="170"
              letter-spacing="-5"
              stroke-width="130"
            >jubilee</text>
            <!-- Flat base so the edge URL runs straight -->
            <rect class="keyline" x="200" y="600" width="500" height="71" stroke-width="130" />
          </g>

          <!-- Artwork -->
          <g transform="translate(285.4 167) scale(3.4)" fill="none">
            <path d="M60 8 V60 A20 20 0 0 1 20 60 V38" stroke="#0b0e14" stroke-width="14.5" stroke-linecap="butt" />
            <path d="M36 27 H84" stroke="#ffb81c" stroke-width="14.5" stroke-linecap="butt" />
          </g>
          <text
            class="wide"
            x="450"
            y="637"
            text-anchor="middle"
            font-family="'Archivo'"
            font-weight="700"
            font-size="170"
            letter-spacing="-5"
            fill="#0b0e14"
          >jubilee</text>

          <!-- Edge URL -->
          <text
            x="453.5"
            y="713"
            text-anchor="middle"
            font-family="'Archivo'"
            font-weight="800"
            font-size="28"
            letter-spacing="7"
            fill="#000000"
          >JUBILEE.TO</text>
        </g>
      </svg>
    </div>
  </body>
</html>
