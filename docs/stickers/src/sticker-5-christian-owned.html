<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jubilee sticker: Christian-owned</title>
    <link rel="stylesheet" href="stickers.css" />
  </head>
  <body>
    <div class="stage">
      <!-- Sticker 5: the Equity Green decal for shop windows and tills, for
           businesses on Jubilee (components/DecalSticker.tsx). -->
      <svg class="sticker" viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg">
        <title>Proudly Christian-owned decal sticker</title>

        <!-- Die cut -->
        <g id="cut">
          <rect class="keyline" x="120" y="205" width="660" height="500" rx="56" stroke-width="130" />
        </g>

        <!-- Tile, with a darker underside -->
        <rect x="120" y="215" width="660" height="490" rx="56" fill="#006b47" />
        <rect x="120" y="205" width="660" height="490" rx="56" fill="#00875a" />

        <g transform="translate(362.9 235.6) scale(1.8)" fill="none">
          <path d="M60 8 V60 A20 20 0 0 1 20 60 V38" stroke="#f4f2ec" stroke-width="14.5" stroke-linecap="butt" />
          <path d="M36 27 H84" stroke="#ffb81c" stroke-width="14.5" stroke-linecap="butt" />
        </g>

        <text x="450" y="466" text-anchor="middle" font-family="'Inter'" font-weight="600" font-size="34" fill="#ffb81c">Proudly</text>
        <text x="450" y="544" text-anchor="middle" font-family="'Archivo'" font-weight="800" font-size="60" letter-spacing="-1" fill="#f4f2ec">Christian-owned</text>
        <line x1="390" y1="584" x2="510" y2="584" stroke="#ffb81c" stroke-width="3" />
        <text x="450" y="634" text-anchor="middle" font-family="'Inter'" font-weight="500" font-size="28" fill="#f4f2ec" fill-opacity="0.85">Find us on Jubilee</text>

        <!-- Edge URL -->
        <text
          x="453.5"
          y="747"
          text-anchor="middle"
          font-family="'Archivo'"
          font-weight="800"
          font-size="28"
          letter-spacing="7"
          fill="#000000"
        >JUBILEE.TO</text>
      </svg>
    </div>
  </body>
</html>
