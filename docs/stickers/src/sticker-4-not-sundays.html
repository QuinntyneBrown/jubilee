<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jubilee sticker: not Sundays</title>
    <link rel="stylesheet" href="stickers.css" />
  </head>
  <body>
    <div class="stage">
      <!-- Sticker 4: "Find it in seconds, not Sundays." in a gold speech bubble,
           the mark peeking over the corner (components/BubbleSticker.tsx). -->
      <svg class="sticker" viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg">
        <title>Find it in seconds, not Sundays sticker</title>
        <g transform="translate(0 60)">
          <!-- Die cut -->
          <g id="cut">
            <rect class="keyline" x="110" y="200" width="680" height="350" rx="64" stroke-width="130" />
            <path class="keyline" d="M190 520 L165 640 L300 520 Z" stroke-width="130" />
            <circle class="keyline" cx="740" cy="210" r="78" stroke-width="130" />
          </g>

          <!-- Bubble, with a darker underside -->
          <path d="M190 520 L165 640 L300 520 Z" fill="#d99500" transform="translate(0 10)" />
          <rect x="110" y="200" width="680" height="340" rx="64" fill="#d99500" transform="translate(0 10)" />
          <path d="M190 520 L165 640 L300 520 Z" fill="#ffb81c" />
          <rect x="110" y="200" width="680" height="340" rx="64" fill="#ffb81c" />

          <text x="170" y="318" font-family="'Inter'" font-weight="600" font-size="30" fill="#0b0e14" fill-opacity="0.72">A plumber, a lawyer, a Bible.</text>
          <text x="168" y="400" font-family="'Archivo'" font-weight="800" font-size="52" letter-spacing="-1" fill="#0b0e14">Find it in seconds,</text>
          <text x="168" y="464" font-family="'Archivo'" font-weight="800" font-size="52" letter-spacing="-1" fill="#0b0e14">not Sundays.</text>

          <!-- The mark, peeking over the top-right corner -->
          <circle cx="740" cy="210" r="78" fill="#0b0e14" />
          <g transform="translate(686.8 157.6) scale(1.1)" fill="none">
            <path d="M60 8 V60 A20 20 0 0 1 20 60 V38" stroke="#f4f2ec" stroke-width="14.5" stroke-linecap="butt" />
            <path d="M36 27 H84" stroke="#ffb81c" stroke-width="14.5" stroke-linecap="butt" />
          </g>

          <!-- Edge URL -->
          <text
            x="523.5"
            y="592"
            text-anchor="middle"
            font-family="'Archivo'"
            font-weight="800"
            font-size="28"
            letter-spacing="7"
            fill="#000000"
          >JUBILEE.TO</text>
        </g>
      </svg>
    </div>
  </body>
</html>
