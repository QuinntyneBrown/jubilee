<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jubilee business cards</title>
    <link rel="stylesheet" href="cards.css" />
  </head>
  <body>
    <!-- The "Business Cards" frame in Magic Patterns (link in the README), one
         .card-face per printed side. Every measurement is in em and 1em = 1in. -->

    <div class="card-face card-face--night" id="front">
      <div class="card-face__safe">
        <div class="front">
          <div class="lockup" role="img" aria-label="Jubilee">
            <svg class="lockup__mark" viewBox="0 0 100 100" fill="none" aria-hidden="true">
              <path d="M60 8 V60 A20 20 0 0 1 20 60 V38" stroke="#f4f2ec" stroke-width="14.5" stroke-linecap="butt" stroke-linejoin="miter" />
              <path d="M36 27 H84" stroke="#ffb81c" stroke-width="14.5" stroke-linecap="butt" />
            </svg>
            <span class="lockup__wordmark">jubilee</span>
          </div>
          <p class="front__line">Prosper with purpose.</p>
        </div>
      </div>
    </div>

    <div class="card-face card-face--cream" id="quinntyne-brown-back">
      <div class="card-face__safe">
        <div class="back">
          <div class="back__top">
            <div>
              <p class="back__name">Quinntyne Brown</p>
              <p class="back__title">Founder and CEO</p>
            </div>
            <svg class="back__mark" viewBox="0 0 100 100" fill="none" aria-hidden="true">
              <path d="M60 8 V60 A20 20 0 0 1 20 60 V38" stroke="#0b0e14" stroke-width="14.5" stroke-linecap="butt" stroke-linejoin="miter" />
              <path d="M36 27 H84" stroke="#ffb81c" stroke-width="14.5" stroke-linecap="butt" />
            </svg>
          </div>
          <div class="back__contact">
            <p class="back__email">quinntyne.brown@jubilee.to</p>
            <p class="back__website">www.jubilee.to</p>
          </div>
        </div>
      </div>
    </div>

    <div class="card-face card-face--cream" id="jordan-renda-back">
      <div class="card-face__safe">
        <div class="back">
          <div class="back__top">
            <div>
              <p class="back__name">Jordan Renda</p>
              <p class="back__title">Director, Business Partnerships</p>
            </div>
            <svg class="back__mark" viewBox="0 0 100 100" fill="none" aria-hidden="true">
              <path d="M60 8 V60 A20 20 0 0 1 20 60 V38" stroke="#0b0e14" stroke-width="14.5" stroke-linecap="butt" stroke-linejoin="miter" />
              <path d="M36 27 H84" stroke="#ffb81c" stroke-width="14.5" stroke-linecap="butt" />
            </svg>
          </div>
          <div class="back__contact">
            <p class="back__email">jordan.renda@jubilee.to</p>
            <p class="back__website">www.jubilee.to</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
