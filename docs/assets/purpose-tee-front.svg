<svg xmlns="http://www.w3.org/2000/svg" width="600" height="700" viewBox="0 0 600 700" role="img" aria-label="The Purpose Tee from the front: “Prosper with purpose.” across the chest, “purpose.” in gold"><style>.tee__fabric{fill:#070a0f;stroke:rgba(11,14,20,.18);stroke-width:2;stroke-linejoin:round}.tee__seams{fill:none;stroke:rgba(11,14,20,.18);stroke-width:2}.tee__rib{fill:none;stroke:#000;stroke-width:16;stroke-linecap:round}.tee__print{fill:#f4f2ec;font-family:Archivo,system-ui,sans-serif;font-weight:800;font-stretch:110%;letter-spacing:-0.03em;font-size:46px}.tee__highlight{fill:#ffb81c}.tee__mark{fill:none;stroke-width:14.5}.tee__mark-j{stroke:#f4f2ec}.tee__mark-bar{stroke:#ffb81c}.tee__domain{fill:#f4f2ec;font-family:Archivo,system-ui,sans-serif;font-weight:600;font-stretch:110%;letter-spacing:.02em;font-size:12px}</style><path class="tee__fabric" d="M225 40 L130 70 L20 178 L96 258 L142 218 L142 680 L458 680 L458 218 L504 258 L580 178 L470 70 L375 40 Q300 122 225 40 Z"/><g class="tee__seams"><path d="M130 70 Q152 146 142 218"/><path d="M470 70 Q448 146 458 218"/><path d="M34 192 L106 268" transform="translate(4 -6)"/><path d="M566 192 L494 268" transform="translate(-4 -6)"/><path d="M142 664 L458 664"/></g><path class="tee__rib" d="M225 40 Q300 122 375 40"/><text class="tee__print"><tspan x="186" y="195">Prosper</tspan><tspan x="186" y="236">with</tspan><tspan class="tee__highlight" x="186" y="277">purpose.</tspan></text></svg>
