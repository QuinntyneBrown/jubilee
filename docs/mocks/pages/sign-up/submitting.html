<main id="main" class="auth-layout"><a class="auth-brand" href="../../pages/welcome/default.html"><svg class="icon brand-mark" aria-hidden="true" viewBox="0 0 24 24"><path d="M8 4v9a4 4 0 0 0 8 0V4M12 2v6M9.5 5h5"/></svg>jubilee</a><div class="auth-card card stack"><h1>Join Jubilee</h1><p class="text-muted">Free for everyone in Toronto’s Christian community.</p>
<form class="stack" novalidate>
<div class="form-grid form-grid--2"><div class="field"><label class="field__label" for="first">First name <span class="optional">(required)</span></label><input class="input" id="first" type="text" value="Joanna" placeholder="" required autocomplete="given-name" readonly></div><div class="field"><label class="field__label" for="last">Last name <span class="optional">(required)</span></label><input class="input" id="last" type="text" value="Adeyemi" placeholder="" required autocomplete="family-name" readonly></div></div>
<div class="field"><label class="field__label" for="email">E-mail <span class="optional">(required)</span></label><input class="input" id="email" type="email" value="joanna.adeyemi@example.com" placeholder="" required autocomplete="email" readonly></div>
<div class="field"><label class="field__label" for="password">Password <span class="optional">(required)</span></label><span class="field__help" id="password-help">At least 10 characters.</span><input class="input" id="password" type="password" value="longpassword1" placeholder="" aria-describedby="password-help" required autocomplete="new-password" readonly></div>
<div class="field"><label class="field__label" for="church">Home church <span class="optional">(optional)</span></label><span class="field__help" id="church-help">Shown to no one. Helps us recommend businesses near you.</span><input class="input" id="church" type="text" value="Grace Toronto Church" placeholder="" aria-describedby="church-help" readonly></div>
<div><label class="choice"><input type="checkbox" id="agree" checked disabled><span class="choice__text">I agree to Jubilee’s <a href="../../pages/statement-of-faith/default.html">statement of faith</a> and <a href="../../pages/terms/default.html">terms</a>.</span></label></div>

<button class="btn btn--block btn--lg" type="button" disabled>Join with Google</button>
